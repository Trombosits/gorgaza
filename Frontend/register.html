<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daftar - GOR GAZA</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      rel="stylesheet"
    />
    <link href="style.css" rel="stylesheet" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
      <div class="container">
        <a class="navbar-brand" href="landing_page.html">GOR GAZA</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto me-3">
            <li class="nav-item">
              <a class="nav-link" href="landing_page.html#hero">Booking</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="landing_page.html#fasilitas"
                >Fasilitas</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="landing_page.html#jadwal">Jadwal</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="landing_page.html#lokasi">Lokasi</a>
            </li>
          </ul>

          <div class="nav-auth">
            <a class="btn btn-book" href="login.html">Login / Daftar</a>
          </div>
        </div>
      </div>
    </nav>

    <section
      class="auth-section"
      style="margin-top: 100px; margin-bottom: 100px"
    >
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-6">
            <div class="auth-card">
              <h2>Buat Akun Baru</h2>
              <p>
                Daftar untuk mulai booking lapangan dan bermain billiard di GOR
                GAZA.
              </p>

              <form id="registerForm">
                <div class="mb-3">
                  <label class="form-label">Nama Lengkap</label>
                  <input
                    id="regName"
                    type="text"
                    class="form-control"
                    placeholder="Masukkan nama lengkap"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input
                    id="regEmail"
                    type="email"
                    class="form-control"
                    placeholder="Masukkan email"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Nomor Telepon</label>
                  <input
                    id="regPhone"
                    type="tel"
                    class="form-control"
                    placeholder="0812xxxxxxx"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input
                    id="regPassword"
                    type="password"
                    class="form-control"
                    placeholder="Masukkan password"
                    required
                  />
                </div>

                <div class="mb-4">
                  <label class="form-label">Konfirmasi Password</label>
                  <input
                    id="regPasswordConfirm"
                    type="password"
                    class="form-control"
                    placeholder="Ulangi password"
                    required
                  />
                </div>

                <div
                  class="d-flex justify-content-between align-items-center mb-4 auth-footer"
                >
                  <span>Sudah punya akun?</span>
                  <a href="login.html" class="text-decoration-none"
                    >Masuk sekarang</a
                  >
                </div>

                <button type="submit" class="btn btn-book w-100">
                  <i class="fas fa-user-plus me-2"></i>
                  Daftar
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer>
      <div class="container text-center">
        <p>© 2026 GOR GAZA. All Rights Reserved.</p>
      </div>
    </footer>

    <a
      href="https://wa.me/6281234567890"
      class="whatsapp-float"
      target="_blank"
    >
      <i class="fab fa-whatsapp"></i>
    </a>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
